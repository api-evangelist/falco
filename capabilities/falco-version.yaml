naftiko: 1.0.0-alpha2
info:
  label: Falco HTTP API — Version
  description: 'Falco HTTP API — Version. 1 operations. Lead operation: Falco Version information. Self-contained Naftiko
    capability covering one Falco business surface.'
  tags:
  - Falco
  - Version
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FALCO_API_KEY: FALCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: falco-version
    baseUri: http://localhost:8765
    description: Falco HTTP API — Version business capability. Self-contained, no shared references.
    resources:
    - name: version
      path: /version
      operations:
      - name: getversion
        method: GET
        description: Falco Version information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: falco-version-rest
    port: 8080
    description: REST adapter for Falco HTTP API — Version. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/version
      name: version
      description: REST surface for version.
      operations:
      - method: GET
        name: getversion
        description: Falco Version information
        call: falco-version.getversion
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: falco-version-mcp
    port: 9090
    transport: http
    description: MCP adapter for Falco HTTP API — Version. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: falco-version-information
      description: Falco Version information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: falco-version.getversion
      outputParameters:
      - type: object
        mapping: $.
