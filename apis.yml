aid: falco
name: Falco
description: >-
  Falco is a cloud-native runtime security tool that detects unexpected
  application behavior and alerts on threats at runtime using eBPF. It is a
  CNCF graduated project that continuously monitors Linux kernel syscalls and
  compares them against configurable security rules to detect intrusions,
  privilege escalation, and other suspicious behaviors.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
