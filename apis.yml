apis:
- aid: falco:falco-plugin-api
  name: Falco Plugin API
  description: >-
    The Falco Plugin API provides a C ABI interface for developing plugins that extend Falco with new
    event sources and field extractors. Plugins are shared libraries that implement the plugin API and
    can be loaded at runtime to add support for new data sources such as cloud audit logs, container activity,
    and custom event streams.
  humanURL: https://falco.org/docs/reference/plugins/plugin-api-reference/
  tags:
  - Developer Tools
  - Event Sources
  - Plugin
